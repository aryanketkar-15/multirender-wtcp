name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  attestor:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: attestor } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: attestor/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  verifier:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: verifier } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: verifier/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mra_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s
          --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: mra_test
      DB_TEST_NAME: mra_test
      DB_USER: root
      DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'pdo_mysql, sodium, mbstring', tools: composer }
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test
