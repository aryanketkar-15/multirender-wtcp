name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  attestor:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: attestor } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: attestor/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  verifier:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: verifier } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: verifier/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', extensions: 'pdo_mysql, sodium, mbstring', tools: composer }
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test
