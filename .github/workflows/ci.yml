name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Coverage gate (changed files, 70% lines)
        run: |
          npm run test:ci 2>&1 | tee test-ci.log
          { echo '### client coverage'; echo '```'; grep -A6 'Coverage summary' test-ci.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  attestor:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: attestor } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: attestor/package-lock.json }
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('attestor/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Coverage gate (changed files, 70% lines)
        run: |
          npm run test:ci 2>&1 | tee test-ci.log
          { echo '### attestor coverage'; echo '```'; grep -A6 'Coverage summary' test-ci.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  verifier:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: verifier } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: verifier/package-lock.json }
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('verifier/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Coverage gate (changed files, 70% lines)
        run: |
          npm run test:ci 2>&1 | tee test-ci.log
          { echo '### verifier coverage'; echo '```'; grep -A6 'Coverage summary' test-ci.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mra_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s
          --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: mra_test
      DB_TEST_NAME: mra_test
      DB_USER: root
      DB_PASS: root
      DB_ADMIN_USER: root
      DB_ADMIN_PASS: root
      # Throwaway, test-only values. They protect nothing: the CI database is created and destroyed per run.
      APP_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      BLIND_INDEX_PEPPER: ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100
      MRA_SERVER_SK: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MRA_KEY_ID: ci-k1
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, sodium, mbstring, openssl
          coverage: pcov
          tools: composer
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('server/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - name: Tests (run twice to prove isolation)
        run: |
          vendor/bin/phpunit --coverage-clover coverage/clover.xml --coverage-text | tee test.log
          vendor/bin/phpunit
          { echo '### server coverage'; echo '```'; grep -E 'Lines:|Classes:' test.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage gate (changed files, 70% lines)
        working-directory: .
        run: php scripts/php-coverage-gate.php server/coverage/clover.xml origin/main 70

  # T7.2.9 — Accessibility gate: run axe-core against every client route.
  # An unlabelled button, missing aria-label, or AA contrast violation fails CI.
  accessibility:
    runs-on: ubuntu-latest
    needs: client
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run build

      # Install axe-core CLI (zero runtime deps, uses Chromium via Playwright)
      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      # Start the built app on port 4173 (vite preview default)
      - name: Start preview server
        run: npx vite preview --port 4173 &
        env:
          NODE_ENV: production

      # Wait for server to be ready
      - name: Wait for server
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:4173 && break || sleep 1
          done

      # Run axe against all client routes. --exit fails with code 1 if any violation.
      # --tags wcag2a,wcag2aa enforces WCAG 2.1 AA (T7.2.7).
      - name: Run axe accessibility scan
        id: axe
        run: |
          axe \
            http://localhost:4173/ \
            http://localhost:4173/login \
            http://localhost:4173/register \
            http://localhost:4173/verifier \
            --exit \
            --tags wcag2a,wcag2aa \
            --reporter cli \
            2>&1 | tee axe-report.txt
          EXIT=${PIPESTATUS[0]}
          echo "## Accessibility report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat axe-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $EXIT

